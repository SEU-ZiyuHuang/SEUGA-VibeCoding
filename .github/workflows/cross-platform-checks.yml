name: Cross-platform checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        working-directory: SEUCampusGuidance/agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: SEUCampusGuidance/agent/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check

      - name: Verify shared knowledge artifacts
        run: npm run verify:shared

      - name: Verify newline normalization
        run: npm run test:newlines

      - name: Verify wiki fidelity
        run: npm run verify:wiki

      - name: Run retrieval regression suite
        run: npm run suite

      - name: Test agent loop
        run: npm run test:loop

      - name: Test prompt configuration safety
        run: npm run test:config

      - name: Test private Blob storage
        run: npm run test:storage

      - name: Test fast path
        run: npm run test:fastpath

      - name: Test Markdown renderer
        run: npm run test:markdown
